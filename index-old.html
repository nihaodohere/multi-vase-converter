<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101827">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="进制转换">
<title>多进制转换器</title>
<style>
:root{color-scheme:dark;--bg:#0b1220;--panel:#121d30;--panel2:#19263b;--text:#f3f6fc;--muted:#9eacc2;--line:#2b3a52;--accent:#73a7ff;--good:#68d6a0;--bad:#ff8b8b}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(160deg,#14233a 0%,var(--bg) 42%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh;padding:env(safe-area-inset-top) 16px calc(24px + env(safe-area-inset-bottom))}
main{max-width:560px;margin:0 auto;padding-top:18px}.brand{display:flex;align-items:center;gap:12px;margin:8px 0 22px}.logo{width:48px;height:48px;border-radius:15px;background:#244a7b;display:grid;place-items:center;font-size:25px;box-shadow:0 8px 24px #0004}.brand h1{font-size:22px;margin:0 0 4px}.brand p{margin:0;color:var(--muted);font-size:13px}
.card{background:rgba(18,29,48,.94);border:1px solid var(--line);border-radius:20px;padding:17px;margin:13px 0;box-shadow:0 10px 32px #0002}
label,.section-title{display:block;font-size:14px;font-weight:650;margin-bottom:9px}.row{display:flex;gap:9px;align-items:center}.row>*{min-width:0}.row select{flex:1}select,input{width:100%;border:1px solid #3a4b65;border-radius:12px;background:var(--panel2);color:var(--text);font-size:16px;padding:13px;outline:none}input{font-size:20px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}input:focus,select:focus{border-color:var(--accent)}.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:10px 0 15px}.quick button{border:1px solid var(--line);background:var(--panel2);color:var(--muted);padding:10px 2px;border-radius:11px;font-size:12px}.quick button.active{background:#244a7b;border-color:#73a7ff;color:white}.hint{font-size:12px;color:var(--muted);margin:9px 0 0}.status{font-size:12px;margin-top:8px;min-height:16px}.status.ok{color:var(--good)}.status.err{color:var(--bad)}.result{padding:12px 0;border-bottom:1px solid var(--line)}.result:last-child{border-bottom:0;padding-bottom:0}.result-head{display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:13px;margin-bottom:7px}.result-value{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:16px;line-height:1.5;overflow-wrap:anywhere;word-break:break-word}.copy{border:1px solid var(--line);background:#20324d;color:#e8f0ff;border-radius:9px;padding:7px 10px;font-size:12px}.custom-value{font-size:23px;font-weight:700;overflow-wrap:anywhere;word-break:break-word}.toggle{display:flex;align-items:center;gap:9px;color:var(--muted);font-size:13px;margin-top:12px}.toggle input{width:18px;height:18px;accent-color:var(--accent)}.footer{text-align:center;color:#7f90aa;font-size:11px;padding:8px 0 20px}.clear{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;background:transparent;color:var(--muted);font-size:14px;margin-top:12px}
</style>
</head>
<body>
<main>
  <header class="brand"><div class="logo">⑯</div><div><h1>多进制转换器</h1><p>2～36 进制 · 实时转换 · 一键复制</p></div></header>
  <section class="card">
    <label for="base">输入进制</label>
    <div class="quick" id="quick">
      <button data-base="2">二进制 · 2</button><button data-base="8">八进制 · 8</button><button data-base="10">十进制 · 10</button><button data-base="16" class="active">十六进制 · 16</button>
    </div>
    <div class="row"><select id="base" aria-label="输入进制"></select></div>
    <label for="value" style="margin-top:17px">输入数值</label>
    <input id="value" value="FF" placeholder="例如 FF、1010、255" autocapitalize="characters" autocomplete="off" spellcheck="false">
    <div id="status" class="status ok">输入有效，已自动完成转换</div>
    <label class="toggle"><input id="prefix" type="checkbox"> 显示进制前缀（0x、0b、0o）</label>
  </section>
  <section class="card">
    <div class="section-title">常用进制转换结果</div>
    <div id="results"></div>
  </section>
  <section class="card">
    <div class="section-title">自定义输出进制</div>
    <label for="outBase">目标进制</label><select id="outBase"></select>
    <div class="result" style="padding-top:15px">
      <div class="result-head"><span id="customLabel">转换结果（10 进制）</span><button class="copy" data-copy="custom">复制结果</button></div>
      <div class="custom-value" id="customValue">255</div>
    </div>
  </section>
  <button class="clear" id="clear">清空并重置</button>
  <p class="footer">所有转换均在本机浏览器完成，无需上传输入内容。</p>
</main>
<script>
const digits='0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ';
const baseSel=document.querySelector('#base'), outSel=document.querySelector('#outBase'), valueEl=document.querySelector('#value'), statusEl=document.querySelector('#status'), prefixEl=document.querySelector('#prefix');
for(let b=2;b<=36;b++){let a=document.createElement('option');a.value=b;a.textContent=`${b} 进制`;baseSel.append(a);let o=document.createElement('option');o.value=b;o.textContent=`${b} 进制`;outSel.append(o)}
baseSel.value='16';outSel.value='10';
function parse(s,b){s=s.trim().toUpperCase();let sign=1n;if(s[0]==='-'){sign=-1n;s=s.slice(1)}else if(s[0]==='+')s=s.slice(1);if(b===16&&s.startsWith('0X'))s=s.slice(2);if(b===2&&s.startsWith('0B'))s=s.slice(2);if(b===8&&s.startsWith('0O'))s=s.slice(2);if(!s)return {error:'请输入数值'};let n=0n;for(const c of s){const d=digits.indexOf(c);if(d<0||d>=b)return {error:`字符“${c}”不适用于 ${b} 进制`};n=n*BigInt(b)+BigInt(d)}return {value:n*sign}}
function format(n,b){let neg=n<0n;if(neg)n=-n;let s=n.toString(b).toUpperCase();let p=prefixEl.checked?({2:'0b',8:'0o',16:'0x'}[b]||''):'';return (neg?'-':'')+p+s}
function copyText(s,btn){if(!s||s==='—')return;const old=btn.textContent;const done=()=>{btn.textContent='已复制';setTimeout(()=>btn.textContent=old,1000)};if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(s).then(done).catch(()=>fallback(s,done))}else fallback(s,done)}
function fallback(s,done){const t=document.createElement('textarea');t.value=s;document.body.append(t);t.select();try{document.execCommand('copy');done()}catch(e){}t.remove()}
const common=[{label:'二进制',base:2},{label:'八进制',base:8},{label:'十进制',base:10},{label:'十六进制',base:16}];
function render(){const b=Number(baseSel.value),p=parse(valueEl.value,b),results=document.querySelector('#results');document.querySelectorAll('#quick button').forEach(x=>x.classList.toggle('active',Number(x.dataset.base)===b));results.innerHTML='';if(p.error){statusEl.className='status err';statusEl.textContent='⚠ '+p.error;common.forEach(x=>{const d=document.createElement('div');d.className='result';d.innerHTML=`<div class="result-head">${x.label}（${x.base} 进制）</div><div class="result-value">—</div>`;results.append(d)});document.querySelector('#customValue').textContent='—';return}
statusEl.className='status ok';statusEl.textContent='✓ 输入有效，已自动完成转换';common.forEach(x=>{const d=document.createElement('div');d.className='result';const head=document.createElement('div');head.className='result-head';head.innerHTML=`<span>${x.label}（${x.base} 进制）</span>`;const btn=document.createElement('button');btn.className='copy';btn.textContent='复制';const val=document.createElement('div');val.className='result-value';val.textContent=format(p.value,x.base);btn.onclick=()=>copyText(val.textContent,btn);head.append(btn);d.append(head,val);results.append(d)});
const ob=Number(outSel.value);document.querySelector('#customLabel').textContent=`转换结果（${ob} 进制）`;document.querySelector('#customValue').textContent=format(p.value,ob)}
valueEl.addEventListener('input',render);baseSel.addEventListener('change',render);outSel.addEventListener('change',render);prefixEl.addEventListener('change',render);document.querySelectorAll('#quick button').forEach(btn=>btn.addEventListener('click',()=>{baseSel.value=btn.dataset.base;render()}));document.querySelector('[data-copy="custom"]').addEventListener('click',e=>copyText(document.querySelector('#customValue').textContent,e.currentTarget));document.querySelector('#clear').addEventListener('click',()=>{valueEl.value='';baseSel.value='16';outSel.value='10';prefixEl.checked=false;render();valueEl.focus()});render();
</script>
</body>
</html>
